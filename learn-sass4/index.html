<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Landing Page - Tái cấu trúc SASS</title>
  <!-- Nhúng file CSS được biên dịch từ SASS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="header">
    <nav class="nav">
      <div class="nav__logo">MyBrand</div>
      <ul class="nav__menu">
        <li><a href="#">Trang chủ</a></li>
        <li><a href="#">Sản phẩm</a></li>
        <li><a href="#">Thống kê</a></li>
        <li><a href="#">Liên hệ</a></li>
      </ul>
    </nav>
  </header>

  <section class="products">
    <h2 class="products__title">Sản Phẩm Nổi Bật</h2>
    <div class="products__grid">
      <div class="product-card">
        <img class="product-card__image" src="https://via.placeholder.com/150" alt="Sản phẩm 1">
        <h3 class="product-card__name">Sản phẩm 1</h3>
      </div>
      <div class="product-card">
        <img class="product-card__image" src="https://via.placeholder.com/150" alt="Sản phẩm 2">
        <h3 class="product-card__name">Sản phẩm 2</h3>
      </div>
    </div>
  </section>

  <section class="stats">
    <div class="stats__item">
      <div class="stats__item-number">100+</div>
      <div class="stats__item-label">Khách hàng</div>
    </div>
    <div class="stats__item">
      <div class="stats__item-number">50+</div>
      <div class="stats__item-label">Dự án</div>
    </div>
  </section>

  <footer class="footer">
    <p>&copy; 2026 Landing Page. All rights reserved.</p>
  </footer>

</body>
</html>
